; Two boards, one source. Pin maps differ: the C3 is RISC-V and has no GPIO 16/17/22/23,
; so the E220 pins are set per environment rather than hard-coded.

[env]
# Pinned, not floating. An unpinned platform silently changed ESP-IDF major version between
# a local build and CI, producing two different binaries from one commit; the release shipped
# the one nobody had put on a board. Bump this deliberately, and re-check bonding when you do.
platform = espressif32@7.1.2
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:esp32dev]
; Classic ESP32-WROOM — same board the remote-serial project uses.
board = esp32dev
build_flags =
    -DPIN_E220_TX=17
    -DPIN_E220_RX=16
    -DPIN_E220_M0=21
    -DPIN_E220_M1=22
    -DPIN_E220_AUX=23

[env:esp32s3]
; ESP32-S3 (Xtensa, dual core, native USB). GPIO 19/20 are USB, 26-32 are flash/PSRAM,
; 45/46 are strapping pins — these are clear of all of it.
board = esp32-s3-devkitc-1
build_flags =
    -DPIN_E220_TX=17
    -DPIN_E220_RX=16
    -DPIN_E220_M0=15
    -DPIN_E220_M1=7
    -DPIN_E220_AUX=6

[env:esp32c3]
; ESP32-C3 (RISC-V). Plain GPIOs clear of the strapping and flash pins.
; On a two-USB-C board, flash over the UART port; the other is native USB.
board = esp32-c3-devkitm-1
build_flags =
    -DPIN_E220_TX=5
    -DPIN_E220_RX=4
    -DPIN_E220_M0=6
    -DPIN_E220_M1=7
    -DPIN_E220_AUX=10
