; Three boards, one source. Pin maps differ: the C3 is RISC-V and has no GPIO 16/17/22/23,
; so the E220 pins are set per environment rather than hard-coded.

[env]
# Pinned, not floating. An unpinned platform silently changed ESP-IDF major version between
# a local build and CI, producing two different binaries from one commit; the release shipped
# the one nobody had put on a board. Bump this deliberately, and re-check bonding when you do.
platform = espressif32@7.1.2
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:esp32dev]
; Classic ESP32-WROOM — same board the remote-serial project uses.
; Drives an EBYTE E220 or an E22 from one image - the part identifies itself at init, so there
; is no flag to get wrong.
; PIN_LED is the onboard LED of the board on the bench, not a property of this target: the
; generic "ESP32 Dev Module" says nothing about one. Leave it undefined for a board you have
; not checked - a guessed pin is either dark or drives something that is not an indicator.
; Omit it to build without any indicator at all.
board = esp32dev
build_flags =
    -DRADIO_BACKEND_E220
    -DPIN_E220_TX=17
    -DPIN_E220_RX=16
    -DPIN_E220_M0=21
    -DPIN_E220_M1=22
    -DPIN_E220_AUX=23
    -DPIN_PAIR_BUTTON=0
    -DMIN_POWER_INDEX=0
    -DPIN_LED=2

[env:esp32s3]
; ESP32-S3 (Xtensa, dual core, native USB). The E220 pins avoid USB, flash/PSRAM and
; strapping pins. GPIO0 is intentionally the board's BOOT button and is read only at runtime.
board = esp32-s3-devkitc-1
build_flags =
    -DRADIO_BACKEND_E220
    -DPIN_E220_TX=17
    -DPIN_E220_RX=16
    -DPIN_E220_M0=15
    -DPIN_E220_M1=7
    -DPIN_E220_AUX=6
    -DPIN_PAIR_BUTTON=0
    -DMIN_POWER_INDEX=0

[env:esp32c3]
; ESP32-C3 (RISC-V). The E220 pins avoid the flash pins. GPIO9 is intentionally the board's
; BOOT button and is read only at runtime. On a two-USB-C board, flash over the UART port;
; the other is native USB.
board = esp32-c3-devkitm-1
build_flags =
    -DRADIO_BACKEND_E220
    -DPIN_E220_TX=5
    -DPIN_E220_RX=4
    -DPIN_E220_M0=6
    -DPIN_E220_M1=7
    -DPIN_E220_AUX=10
    -DPIN_PAIR_BUTTON=9
    -DMIN_POWER_INDEX=0

[env:heltec_sx1262]
; Heltec WiFi LoRa 32 V4.3 - ESP32-S3 with an SX1262 and a KCT8103L front end wired on the
; board. The same bridge, a different radio behind the same seam. A V3 has the same chip on the
; same pins and no front end: add -DPIN_FEM_VCTRL=-1 (untried). The front-end pins are the
; V4.3's; check an earlier V4 against Heltec's schematic first.
;
; Transmit is OFF unless -DSX1262_TX_ALLOWED=1 is added: receive and the frame format are both
; proven on hardware, but nobody has put the front end's output on a meter, so a power level
; cannot honestly be mapped to dBm. See sx1262.h.
board = heltec_wifi_lora_32_V3
build_flags =
    -DRADIO_BACKEND_SX1262
    -DPIN_PAIR_BUTTON=0
    -DMIN_POWER_INDEX=0

[env:tdeck_sx1262]
; LILYGO T-Deck / T-Deck Plus - ESP32-S3 with an SX1262 and, unlike the Heltec, nothing between
; the chip and the antenna but a switch. That is the whole reason this target exists: the Heltec
; V4.3 puts a KCT8103L front end in the path, and a bare SX1262 on that board was decoded by an
; E220 about a fifth of the time while an EBYTE E22 - the same chip - was decoded every time.
; This board isolated the driver from that front end. (The cause was not the front end but our
; second sync symbol, found 2026-10-06; see PHY-notes.) Pins are LILYGO's utilities.h and the
; Meshtastic variant, which is the firmware these boards ship with.
;
; No front end, so PIN_FEM_VCTRL=-1 and the status line says "not fitted". DIO2 drives the
; antenna switch, which SetDio2AsRfSwitch already handles. TCXO on DIO3 at 1.8 V, the default.
; Peripheral power sits behind a load switch on GPIO10 - the keyboard, trackball, backlight and
; card slot, not the radio, but it has to come up early or the inrush browns out the chip. The
; display and the card share the radio's SPI bus, so their chip selects are parked high.
;
; Transmit is off unless -DSX1262_TX_ALLOWED=1 is added, same as the Heltec.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DRADIO_BACKEND_SX1262
    -DPIN_SX_NSS=9
    -DPIN_SX_SCK=40
    -DPIN_SX_MOSI=41
    -DPIN_SX_MISO=38
    -DPIN_SX_RST=17
    -DPIN_SX_BUSY=13
    -DPIN_SX_DIO1=45
    -DPIN_FEM_VCTRL=-1
    -DPIN_BOARD_POWERON=10
    -DBOARD_SPI_IDLE_HIGH=12,39
    -DPIN_PAIR_BUTTON=0
    -DMIN_POWER_INDEX=0
