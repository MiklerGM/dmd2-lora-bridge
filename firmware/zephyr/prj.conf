# The bridge on an nRF52840: a Bluetooth peripheral that bonds, the SX1262 on SPI, and the
# board's own USB for logs and the bench - as an ESP32-S3 bridge uses its native USB.

CONFIG_GPIO=y
CONFIG_SPI=y

# Kernel objects the bridge makes at runtime - mutexes, queues, threads and their stacks - and
# the transmit queue's copy of each packet.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=4096
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Why the board last started, restarting it, and the task watchdog.
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_TASK_WDT=y

# Settings - the bonds - on the partition the UF2 layout leaves for them.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# A record whose data was corrupted then fails its read rather than passing for another record;
# the bond store's own scan (store.c) counts on reads that fail saying so.
CONFIG_NVS_DATA_CRC=y

# Logs: deferred, with room to ride out a burst while the USB console catches up.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SMP=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=30
CONFIG_BT_DEVICE_NAME="LoRaBridge-for-DMD2"
# The phone asks for a 247-byte MTU, and lines run to hundreds of characters.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# The phone's commands run on the host's receive thread, radio configuration included.
CONFIG_BT_RX_STACK_SIZE=4096
