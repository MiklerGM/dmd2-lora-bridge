# Runs exactly what `make check` runs locally: no phone, no radio, no secrets.
name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners pinned rather than ubuntu-latest, which becomes Ubuntu 26 from 2026-10-19: an image
# change should arrive as a commit with a green run, not as a red one nobody caused.
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # The runner image ships an SDK, but not necessarily platform 35. This accepts the
      # licences so Gradle may fetch whatever is missing instead of failing on it.
      #
      # packages: '' because the action otherwise runs `sdkmanager tools`, and Google has removed
      # `tools` from the SDK repository - so the default made this step fail with "Failed to find
      # package 'tools'" on a green tree, with no commit of ours involved. Licences are all this
      # step was ever wanted for; Gradle fetches the rest itself.
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      # v5, not v6: v6 moved its caching into a proprietary component under separate terms.
      - uses: gradle/actions/setup-gradle@v5
      - run: make check-android
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Toolchain and framework are ~1 GB of download; the key covers the board set.
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio
      - run: make check-firmware
      - run: make check-bench

  # Tags only, and only behind both checks: a release nobody ran the suite on is worse
  # than no release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # describe --tags feeds versionName, and a shallow clone has no tags to describe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''    # see the note in the android job
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio

      # The same key that signed every APK handed out so far, or riders have to uninstall
      # before they can update. Missing secrets stop the release here rather than producing
      # an unsigned APK that looks like a real one.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::KEYSTORE_B64 secret is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: make release
      - name: Build flashable firmware images
        run: |
          cd firmware
          pio run -s
          make merged

      - name: Collect assets
        run: |
          mkdir -p dist
          cp dmd-lora-bridge-*-release.apk "dist/dmd2-lora-bridge-${GITHUB_REF_NAME}.apk"
          cp firmware/dist/*.bin dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Notes written for the release in docs/releases/<tag>.md, reviewed with the code they
      # describe; a tag without them gets the standing text. GitHub appends the changelog link.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            cat > "$notes" <<'NOTES'
          **Unofficial. Not affiliated with or endorsed by DMD Navigation / Thork Racing.**
          Experimental.

          Sideload the APK (it replaces the genuine DMD-LoRa app; they cannot coexist), and
          flash the image for your board with `esptool.py write_flash 0x0 <file>`. Both halves
          come from the same commit and must match — the BLE name they agree on is part of it.
          NOTES
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file "$notes"

      - name: Clean up the key
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/release.jks"
