plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Stamp the build with its commit. The firmware prints its version at boot, which is the only
// reason a firmware/APK mismatch was ever noticed; the APK had no such thing.
def gitSha = "nogit"
try {
    gitSha = providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }
            .standardOutput.asText.get().trim()
} catch (ignored) {
}

// Signing identity lives outside the repository; without it a release build is simply
// unsigned, so the project still builds for anyone who does not have the key.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.thorkracing.dmdLora'
    compileSdk 35

    defaultConfig {
        // Not a choice. DMD2 addresses the LoRa companion by explicit ComponentName,
        // so this exact application id and the class paths below are mandatory.
        applicationId 'com.thorkracing.dmdLora'
        // DMD2 is minSdk 32, so no device that can run it is below Android 12. Targeting 31
        // means the modern runtime Bluetooth permission model always applies and the legacy
        // BLUETOOTH / location permissions are never needed.
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "0.1+$gitSha"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Left off deliberately. R8 buys a smaller download and nothing else here, while
            // this app depends on names staying put: DMD2 addresses the receiver and service
            // by exact ComponentName, and the unpair path reaches removeBond by reflection.
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        // A red lint gate is part of "make check"; warnings do not block, errors do.
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android ships a stubbed org.json that throws under unit tests; this provides a real one.
    testImplementation 'org.json:json:20240303'
}
