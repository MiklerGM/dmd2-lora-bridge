plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.thorkracing.dmdLora'
    compileSdk 35

    defaultConfig {
        // Not a choice. DMD2 addresses the LoRa companion by explicit ComponentName,
        // so this exact application id and the class paths below are mandatory.
        applicationId 'com.thorkracing.dmdLora'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
