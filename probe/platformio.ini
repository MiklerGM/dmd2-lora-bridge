; PHY probe. Separate from firmware/ on purpose: it is diagnostic scaffolding that will change
; daily while hunting the PHY, and it must not be able to break the bridge build or a release.
[env:heltec_probe]
platform = espressif32@7.1.2
; PlatformIO has no V4 board yet. V4 is the same ESP32-S3 with 8 MB flash and the same LoRa pin
; map, so the V3 definition builds for it; the pins are passed explicitly below regardless.
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; Pinned, not floating. The probe reads RadioLib's own IRQ semantics to tell a payload CRC
; error from a header error - the two are collapsed into one return code - so a version bump is
; a deliberate act, not something that happens on a clean checkout. Same lesson as the platform.
lib_deps = jgromes/RadioLib@7.7.1
build_flags =
    -DDWELL_MS=20000
    ; The board definition sets ARDUINO_USB_MODE but not this, so Serial goes to UART0 and the
    ; native USB port stays silent - which looks exactly like a dead program.
    -DARDUINO_USB_CDC_ON_BOOT=1
